name: launcher

on:
  push:
    branches: ['main', 'arena/**']
    paths:
      - 'launcher/**'
      - 'tools/**'
      - 'apps/web/components/Brand.jsx'
      - '.github/workflows/launcher.yml'
  pull_request:
    paths:
      - 'launcher/**'
      - 'tools/**'
      - 'apps/web/components/Brand.jsx'
      - '.github/workflows/launcher.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build-msix:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        working-directory: launcher/ProjectZero

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Project Zero visual assets
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python ..\..\tools\generate-projectzero-assets.py

      - name: Locate MSBuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild not found' }
          "MSBUILD=$msbuild" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Generate signing certificate
        shell: pwsh
        run: |
          $pw = [guid]::NewGuid().ToString('N')
          $secure = ConvertTo-SecureString $pw -AsPlainText -Force
          $cert = New-SelfSignedCertificate -Type Custom -Subject 'CN=Project Zero' -KeyUsage DigitalSignature -FriendlyName 'Project Zero CI' -CertStoreLocation 'Cert:\CurrentUser\My' -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3','2.5.29.19={text}')
          Export-PfxCertificate -Cert $cert -FilePath "$PWD\ProjectZero.pfx" -Password $secure | Out-Null
          Export-Certificate -Cert $cert -FilePath "$PWD\ProjectZero.cer" | Out-Null
          "SIGN_PW=$pw" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore
        shell: pwsh
        run: |
          & $env:MSBUILD ProjectZero.csproj /t:Restore /p:Configuration=Release /p:Platform=x64 /v:minimal

      - name: Build and sign bundle
        shell: pwsh
        run: |
          & $env:MSBUILD ProjectZero.csproj /p:Configuration=Release /p:Platform=x64 /p:AppxBundle=Always /p:AppxBundlePlatforms=x64 /p:UapAppxPackageBuildMode=SideloadOnly /p:AppxPackageSigningEnabled=true /p:PackageCertificateKeyFile="$PWD\ProjectZero.pfx" /p:PackageCertificatePassword=$env:SIGN_PW /p:AppxPackageDir="$PWD\AppPackages" /v:normal *>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create clean Xbox x64 install folder
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'XboxInstall'
          $deps = Join-Path $out 'Dependencies'
          Remove-Item $out -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $deps | Out-Null

          $bundle = Get-ChildItem (Join-Path $PWD 'AppPackages') -Recurse -File -Filter '*.msixbundle' | Select-Object -First 1
          if (-not $bundle) { throw 'MSIX bundle not found' }
          Copy-Item $bundle.FullName (Join-Path $out $bundle.Name)
          Copy-Item "$PWD\ProjectZero.cer" (Join-Path $out 'ProjectZero.cer')

          $testDir = $bundle.Directory.FullName
          $x64Dir = Join-Path $testDir 'Dependencies\x64'
          if (-not (Test-Path $x64Dir)) { throw "x64 dependency directory not found: $x64Dir" }

          $required = @(
            'Microsoft.NET.CoreFramework.Debug.2.2.appx',
            'Microsoft.NET.CoreRuntime.2.2.appx',
            'Microsoft.VCLibs.x64.14.00.appx'
          )
          foreach ($name in $required) {
            $src = Join-Path $x64Dir $name
            if (-not (Test-Path $src)) { throw "Required x64 dependency missing: $name" }
            Copy-Item $src (Join-Path $deps $name)
          }

          @"
          PROJECT ZERO - XBOX DEV MODE INSTALL

          IMPORTANT - SET THIS AS A GAME
          After installing Project Zero in Xbox Developer Mode / Device Portal,
          configure the package type as GAME, not APP.

          Package:
          $($bundle.Name)

          Dependencies (upload ALL 3):
          Microsoft.NET.CoreFramework.Debug.2.2.appx
          Microsoft.NET.CoreRuntime.2.2.appx
          Microsoft.VCLibs.x64.14.00.appx

          Do not upload ARM, ARM64 or x86 dependencies.
          Do not put ProjectZero.cer in the Dependencies box.

          Controller:
          Use the D-pad or LEFT STICK to move focus and A to select.
          Project Zero disables Xbox mouse-mode emulation in its controller UI.
          "@ | Set-Content (Join-Path $out 'INSTALL.txt')

          Write-Host 'Final Xbox install files:'
          Get-ChildItem $out -Recurse -File | ForEach-Object { Write-Host $_.FullName }

      - name: Upload clean Xbox package
        uses: actions/upload-artifact@v4
        with:
          name: ProjectZero-Xbox-x64
          path: launcher/ProjectZero/XboxInstall/**
          if-no-files-found: error
