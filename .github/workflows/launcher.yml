name: launcher

on:
  push:
    branches: [main]
    paths:
      - 'launcher/**'
      - '.github/workflows/launcher.yml'
  pull_request:
    paths:
      - 'launcher/**'
      - '.github/workflows/launcher.yml'
  workflow_dispatch:

jobs:
  build-msix:
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        working-directory: launcher/ProjectZero

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate MSBuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          "MSBUILD=$msbuild" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using $msbuild"

      - name: Restore
        shell: pwsh
        run: |
          & $env:MSBUILD ProjectZero.csproj /t:Restore /p:Configuration=Release /p:Platform=x64 /v:minimal

      - name: Build and bundle
        shell: pwsh
        run: |
          & $env:MSBUILD ProjectZero.csproj `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:AppxBundle=Always `
            /p:AppxBundlePlatforms=x64 `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageSigningEnabled=false `
            /p:AppxPackageDir="$PWD\AppPackages" `
            /v:minimal

      - name: List bundles
        shell: pwsh
        run: Get-ChildItem -Recurse AppPackages -Include *.msix,*.appx,*.appxbundle,*.msixbundle | Select-Object FullName,Length

      - name: Sign bundle with project certificate
        if: ${{ secrets.PZ_SIGNING_PFX_BASE64 != '' }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'ProjectZero.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String('${{ secrets.PZ_SIGNING_PFX_BASE64 }}'))

          $sdk = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Directory |
            Sort-Object Name -Descending | Select-Object -First 1
          $signtool = Join-Path $sdk.FullName 'x64\signtool.exe'

          $bundle = Get-ChildItem -Recurse AppPackages -Include *.msixbundle,*.appxbundle | Select-Object -First 1
          if (-not $bundle) { throw 'No bundle produced' }

          & $signtool sign /fd SHA256 /f $pfx /p '${{ secrets.PZ_SIGNING_PFX_PASSWORD }}' /td SHA256 "$($bundle.FullName)"
          Write-Host "Signed $($bundle.FullName)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ProjectZero-UWP
          path: |
            launcher/ProjectZero/AppPackages/**/*.msix
            launcher/ProjectZero/AppPackages/**/*.msixbundle
            launcher/ProjectZero/AppPackages/**/*.appx
            launcher/ProjectZero/AppPackages/**/*.appxbundle
            launcher/ProjectZero/AppPackages/**/*.cer
          if-no-files-found: warn
