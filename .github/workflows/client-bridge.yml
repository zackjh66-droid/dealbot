name: client-bridge
on:
  push:
    branches: [main]
    paths: ['client/**', '.github/workflows/client-bridge.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: client/ProjectZeroClient
    steps:
      - uses: actions/checkout@v4
      - name: Locate MSBuild
        shell: pwsh
        run: |
          $vswhere="${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild=& $vswhere -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          if(-not $msbuild){throw 'MSBuild not found'}
          "MSBUILD=$msbuild" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Certificate
        shell: pwsh
        run: |
          $pw=[guid]::NewGuid().ToString('N'); $secure=ConvertTo-SecureString $pw -AsPlainText -Force
          $cert=New-SelfSignedCertificate -Type Custom -Subject 'CN=Project Zero' -KeyUsage DigitalSignature -CertStoreLocation 'Cert:\CurrentUser\My' -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3','2.5.29.19={text}')
          Export-PfxCertificate -Cert $cert -FilePath "$PWD\ProjectZeroClient.pfx" -Password $secure | Out-Null
          Export-Certificate -Cert $cert -FilePath "$PWD\ProjectZeroClient.cer" | Out-Null
          "SIGN_PW=$pw" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Restore and build
        shell: pwsh
        run: |
          & $env:MSBUILD ProjectZeroClient.csproj /t:Restore /p:Configuration=Release /p:Platform=x64 /v:minimal
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          & $env:MSBUILD ProjectZeroClient.csproj /p:Configuration=Release /p:Platform=x64 /p:AppxBundle=Always /p:AppxBundlePlatforms=x64 /p:UapAppxPackageBuildMode=SideloadOnly /p:AppxPackageSigningEnabled=true /p:PackageCertificateKeyFile="$PWD\ProjectZeroClient.pfx" /p:PackageCertificatePassword=$env:SIGN_PW /p:AppxPackageDir="$PWD\AppPackages" /v:normal *>&1 | Tee-Object build.log
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Make clean Xbox install folder
        shell: pwsh
        run: |
          $out=Join-Path $PWD 'XboxInstall'; $deps=Join-Path $out 'Dependencies'
          New-Item -ItemType Directory -Force -Path $out,$deps | Out-Null
          $bundle=Get-ChildItem AppPackages -Recurse -File | Where-Object { $_.Extension -in '.msixbundle','.appxbundle' } | Select-Object -First 1
          if(-not $bundle){throw 'Client bundle not generated'}
          Copy-Item $bundle.FullName $out -Force
          Copy-Item ProjectZeroClient.cer $out -Force
          $generated=Get-ChildItem AppPackages -Recurse -File -Filter '*.appx' | Where-Object { $_.FullName -match '[\\/]x64[\\/]' -or $_.Name -match 'x64' }
          foreach($f in $generated){Copy-Item $f.FullName (Join-Path $deps $f.Name) -Force}
          @('PROJECT ZERO CLIENT BRIDGE - XBOX TEST','Package: use the .msixbundle','Dependencies: add every .appx inside Dependencies','Do not add the .cer as a dependency.','Install beside the Project Zero launcher, then link again.') | Set-Content (Join-Path $out 'INSTALL.txt')
          Get-ChildItem $out -Recurse | ForEach-Object { Write-Host $_.FullName }
      - uses: actions/upload-artifact@v4
        with:
          name: ProjectZero-ClientBridge-Xbox
          path: client/ProjectZeroClient/XboxInstall/**
          if-no-files-found: error